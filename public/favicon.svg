<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gradient2a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#074678" />
      <stop offset="100%" stop-color="#00a3c4" />
    </linearGradient>
    <linearGradient id="gradient2b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3c4" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Symmetrical Hexagonal Framework -->
  <polygon points="50,15 80,32.5 80,67.5 50,85 20,67.5 20,32.5" fill="none" stroke="currentColor" stroke-opacity="0.32" stroke-width="4.5" />
  
  <!-- Helical Pulse Curve A (Deep Blue to Rich Saturated Cyan) -->
  <path d="M30,38 Q50,68 70,38" fill="none" stroke="url(#gradient2a)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Helical Pulse Curve B (Rich Saturated Cyan to Deep Gold) -->
  <path d="M30,62 Q50,32 70,62" fill="none" stroke="url(#gradient2b)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Central Active Interface Node (Solid Blue with a High-Contrast Ring) -->
  <circle cx="50" cy="50" r="4.5" fill="#074678" stroke="#f8fdff" stroke-width="2" />
</svg>